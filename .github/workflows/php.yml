name: PHP Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Check syntax of all PHP files
      run: |
        status=0
        while IFS= read -r -d '' file; do
          php -l "$file" || status=1
        done < <(find . -name '*.php' -not -path './vendor/*' -print0)
        exit $status
