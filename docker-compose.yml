services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-fastfood}
      DB_PASSWORD: ${DB_PASSWORD:-fastfood_dev_pw}
      DB_NAME: ${DB_NAME:-fastfood}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pw}
      MARIADB_DATABASE: ${DB_NAME:-fastfood}
      MARIADB_USER: ${DB_USER:-fastfood}
      MARIADB_PASSWORD: ${DB_PASSWORD:-fastfood_dev_pw}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
